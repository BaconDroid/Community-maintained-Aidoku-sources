name: Build source list
on:
  push:
    branches:
      - main
    paths:
      - "sources/**"
      - "templates/**"
      - ".github/actions/install-aidoku-cli/**"
      - ".github/workflows/build.yaml"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Only these sources are compiled on every push. The rest of the published
  # list is carried over from gh-pages and rebuilt into the index unchanged.
  REBUILT_SOURCES: "en.chikari en.novelbuddy"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown

      - name: Cache rust stuff
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-1.99.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-1.99.0-

      # Every source builds the same dependency graph, so caching each target
      # directory stored 179 copies of the same artifacts: one 8.4 GB entry
      # against a 10 GB repository limit, and 222 seconds to restore on every
      # push. One prepared target directory is cached instead, and each source
      # receives an ordinary copy of it before packaging.
      - name: Cache cargo target seed
        uses: actions/cache@v4
        with:
          path: ~/.cache/aidoku-target-seed
          key: ${{ runner.os }}-target-seed-1.99.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-target-seed-1.99.0-

      - name: Prepare cargo target seed
        shell: bash
        run: |
          set -euo pipefail

          seed="$HOME/.cache/aidoku-target-seed"
          if [[ -d "$seed/wasm32-unknown-unknown/release" ]]; then
            echo "target seed restored from cache"
            exit 0
          fi

          reference=""
          for name in $REBUILT_SOURCES; do
            [[ -f "sources/$name/Cargo.toml" ]] || continue
            reference="sources/$name"
            break
          done
          test -n "$reference"

          echo "building target seed from $reference"
          ( cd "$reference" && cargo build --release --target wasm32-unknown-unknown )

          mkdir -p "$seed"
          cp -a "$reference/target/." "$seed/"
          rm -rf "$reference/target"

          # aidoku package copies the first wasm it finds in the build directory,
          # so a wasm left in the seed could be packaged in place of a source's
          # own binary.
          find "$seed" -name '*.wasm' -delete

      - uses: ./.github/actions/install-aidoku-cli

      - name: Carry over the published packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p staging
          if git fetch --depth=1 origin gh-pages; then
            mkdir -p published
            git archive FETCH_HEAD | tar -x -C published
            if compgen -G "published/sources/*.aix" > /dev/null; then
              cp published/sources/*.aix staging/
              echo "carried over $(ls staging | wc -l) published packages"
            else
              echo "gh-pages holds no packages, the list will be rebuilt"
            fi
          else
            echo "no gh-pages branch yet, the list will be rebuilt"
          fi

      - name: Build sources
        shell: bash
        run: |
          set -euo pipefail

          seed="$HOME/.cache/aidoku-target-seed"

          for name in $REBUILT_SOURCES; do
            source="sources/$name"
            [[ -f "$source/Cargo.toml" ]] || continue

            echo "::group::Packaging $source"
            rm -f "$source/package.aix"
            (
              cd "$source"
              rm -rf target
              cp -a "$seed" target
              aidoku package
            )
            rm -rf "$source/target"
            test -s "$source/package.aix"
            rm -f "staging/$name"-v*.aix
            cp "$source/package.aix" "staging/$name.aix"
            echo "::endgroup::"
          done

      - name: Build source list
        shell: bash
        run: |
          set -euo pipefail

          if ! compgen -G "staging/*.aix" > /dev/null; then
            echo "no package to publish" >&2
            exit 1
          fi
          aidoku build staging/*.aix --output public --name "Aidoku Community Sources"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          branch: gh-pages
          folder: public
          git-config-name: GitHub Actions
          git-config-email: github-actions[bot]@users.noreply.github.com
          commit-message: Update source list
          single-commit: true

      - name: Uploading packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: public/sources/*.aix
          if-no-files-found: ignore
